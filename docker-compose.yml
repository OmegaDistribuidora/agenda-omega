services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agenda_omega
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - agenda_omega_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agenda_omega"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agenda_omega_postgres:
